name: Python

# spell-checker:ignore armv,autodoc,gnueabihf,musleabihf
# spell-checker:ignore pkgs,pydata,pyproject,pythonarm64
# spell-checker:ignore sdist,stubtest,xwin

on:
  push:
    paths:
      - .github/workflows/python.yml
      - bindings/python/**
      - pyproject.toml
      - crates/**
      - "!crates/oxidd-cli/**"
      - "!crates/oxidd-ffi-c/**"
      - Cargo.*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-arm:
    name: Lint, Test, Doc & Build Wheels for Linux (aarch64)

    runs-on: ubuntu-26.04-arm

    outputs:
      package-tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: |
            pypy3.12
            3.11
            3.15t
      - name: Build
        id: build
        run: |
          python -m pip install maturin[zig] -e '.[dev,docs,test]'
          echo "tag=v$(python3 -c 'import oxidd; print(oxidd.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Ruff check
        run: ruff check --output-format=github
      - name: Ruff format check
        run: ruff format --check
      - name: mypy
        run: mypy
      - name: stubtest
        run: python -m mypy.stubtest oxidd._oxidd
      - name: basedpyright
        run: basedpyright
      - name: Test
        run: pytest
      - name: Sphinx
        run: |
          mkdir -p target/python/autodoc/oxidd
          cp bindings/python/oxidd/*.py target/python/autodoc/oxidd
          cp bindings/python/oxidd/_oxidd.pyi target/python/autodoc/oxidd/_oxidd.py
          PYTHONPATH=target/python/autodoc sphinx-build bindings/python/doc target/python/doc
      - name: Add Rust targets to build wheels
        run: |
          rustup target add aarch64-unknown-linux-gnu aarch64-unknown-linux-musl \
            armv7-unknown-linux-gnueabihf armv7-unknown-linux-musleabihf
      - name: Build wheels
        run: |
          manylinux=manylinux2014
          musllinux=musllinux_1_2

          maturin sdist --out dist

          for py in python3.11 python3.15t; do
            for target in aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf; do
              maturin build --release --out dist --interpreter $py --compatibility $manylinux --zig --target $target
            done
            for target in aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
              maturin build --release --out dist --interpreter $py --compatibility $musllinux --zig --target $target
            done
          done

          for py in pypy3.12; do
            for target in aarch64-unknown-linux-gnu; do
              maturin build --release --out dist --interpreter $py --compatibility $manylinux --zig --target $target
            done
            for target in aarch64-unknown-linux-musl; do
              maturin build --release --out dist --interpreter $py --compatibility $musllinux --zig --target $target
            done
          done
      - name: Test wheels
        run: |
          run_tests() {
            "$1" -m venv ".venv-$1"
            ".venv-$1/bin/pip" install "${2}[test]"
            ".venv-$1/bin/pytest"
          }
          run_tests python3.11 dist/oxidd-*-cp*-abi3-manylinux*_aarch64*.whl
          run_tests python3.15t dist/oxidd-*-cp*-*abi3t-manylinux*_aarch64*.whl
          run_tests pypy3.12 dist/oxidd-*-pp312-*-manylinux*_aarch64*.whl
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-linux-arm
          path: dist
      - name: Deploy Docs
        if: >-
          ${{
            github.repository == 'OxiDD/oxidd' && (
              github.ref == 'refs/heads/main'
              || (startsWith(github.ref, 'refs/tags/') && github.ref_name == steps.build.outputs.tag)
            )
          }}
        working-directory: target/python/doc
        run: |
          mkdir -p ~/.ssh
          echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          tag=${{ case(github.ref == 'refs/heads/main', 'dev', steps.build.outputs.tag) }}
          ssh-agent sh -c "echo '$KEY' | ssh-add - && tar -cvz . | ssh -l '$USER' -p '$PORT' '$HOST' /extract-api.php python $tag"
        env:
          HOST: ${{ secrets.WEBSITE_SSH_HOST }}
          USER: ${{ secrets.WEBSITE_SSH_USER }}
          PORT: ${{ secrets.WEBSITE_SSH_PORT }}
          KEY: ${{ secrets.WEBSITE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WEBSITE_SSH_KNOWN_HOSTS }}

  linux-x86_64:
    name: Build wheels for Linux (x86_64)

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: |
            pypy3.12
            3.11
            3.15t
          # last is the default
          cache: pip
      - name: Install Python build dependencies
        run: python -m pip install maturin[zig] ruff
      - name: Add Rust targets to build wheels
        run: |
          rustup target add \
            x86_64-unknown-linux-gnu x86_64-unknown-linux-musl \
            i686-unknown-linux-gnu i686-unknown-linux-musl
      - name: Build wheels
        run: |
          manylinux=manylinux2014
          musllinux=musllinux_1_2

          for py in python3.11 python3.15t pypy3.12; do
            for target in x86_64-unknown-linux-gnu i686-unknown-linux-gnu; do
              maturin build --release --out dist --interpreter $py --compatibility $manylinux --zig --target $target
            done
            for target in x86_64-unknown-linux-musl i686-unknown-linux-musl; do
              maturin build --release --out dist --interpreter $py --compatibility $musllinux --zig --target $target
            done
          done
      - name: Test wheels
        run: |
          run_tests() {
            "$1" -m venv ".venv-$1"
            ".venv-$1/bin/pip" install "${2}[test]"
            ".venv-$1/bin/pytest"
          }
          run_tests python3.11 dist/oxidd-*-cp*-abi3-manylinux*_x86_64*.whl
          run_tests python3.15t dist/oxidd-*-cp*-*abi3t-manylinux*_x86_64*.whl
          run_tests pypy3.12 dist/oxidd-*-pp312-*-manylinux*_x86_64*.whl
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-linux-x86_64
          path: dist

  mac:
    name: Build wheels for macOS

    runs-on: ${{ matrix.os.image }}
    strategy:
      matrix:
        os:
          - { arch: arm64, image: macos-15 }
          - { arch: x86_64, image: macos-15-intel }

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: |
            pypy3.12
            3.11
            3.15t
      - name: Install Python build dependencies
        run: python -m pip install maturin ruff
      - name: Build CPython abi3 wheel
        run: maturin build --release --out dist --interpreter python3.11
      - name: Build CPython abi3t wheel
        run: maturin build --release --out dist --interpreter python3.15t
      - name: Build PyPy 3.12 wheel
        run: maturin build --release --out dist --interpreter pypy3.12
      - name: Test wheels
        run: |
          run_tests() {
            "$1" -m venv ".venv-$1"
            ".venv-$1/bin/pip" install "${2}[test]"
            ".venv-$1/bin/pytest"
          }
          run_tests python3.11 dist/oxidd-*-cp*-abi3-*.whl
          run_tests python3.15t dist/oxidd-*-cp*-*abi3t-*.whl
          run_tests pypy3.12 dist/oxidd-*-pp312-*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-mac-${{ matrix.os.arch }}
          path: dist

  win-arm:
    name: Build wheels for Windows on Arm

    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.11
            3.15t
      - name: Install Python build dependencies
        run: python -m pip install ruff maturin
      - name: Build CPython abi3 wheel
        run: maturin build --release --out dist --interpreter 3.11
      - name: Build CPython abi3t wheel
        run: maturin build --release --out dist --interpreter 3.15t
      - name: Test
        run: |
          py -3.11 -m venv .venv-abi3
          py -3.15t -m venv .venv-abi3t
          foreach ($py in 'abi3', 'abi3t') {
            & ".venv-$py\Scripts\pip.exe" install "$(get-item dist\oxidd-*-*$py[-_]*arm64.whl)[test]"
            & ".venv-$py\Scripts\pytest.exe"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-win-arm
          path: dist

  win-x86_64:
    name: Build wheels for Windows (x86_64)

    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: |
            pypy3.12
            3.11
            3.15t
      - name: Install Python build dependencies
        run: python -m pip install ruff maturin
      - name: Build CPython abi3 wheel (x86_64)
        run: maturin build --release --out dist --interpreter 3.11
      - name: Build CPython abi3t wheel (x86_64)
        run: maturin build --release --out dist --interpreter 3.15t
      - name: Build PyPy 3.12 wheel (x86_64)
        run: maturin build --release --out dist --interpreter pypy3.12
      - name: Test
        run: |
          py -3.11 -m venv .venv-abi3
          py -3.15t -m venv .venv-abi3t
          pypy3.12 -m venv .venv-pypy312
          foreach ($py in 'abi3', 'abi3t', 'pypy312') {
            & ".venv-$py\Scripts\pip.exe" install "$(get-item dist\oxidd-*-*$py[-_]*amd64.whl)[test]"
            & ".venv-$py\Scripts\pytest.exe"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-win-x86_64
          path: dist

  release:
    name: Release
    needs: [linux-arm, linux-x86_64, mac, win-arm, win-x86_64]
    if: >-
      ${{
        github.repository == 'OxiDD/oxidd'
        && startsWith(github.ref, 'refs/tags/')
        && github.ref_name == needs.linux-arm.outputs.package-tag
      }}

    environment:
      name: release
      url: https://pypi.org/p/oxidd
    permissions:
      id-token: write

    runs-on: ubuntu-slim

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: python-wheels-*
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
