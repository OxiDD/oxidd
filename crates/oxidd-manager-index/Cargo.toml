[package]
name = "oxidd-manager-index"
version = "0.13.1"
edition = "2024"
description = "Index-based manager implementation for OxiDD"
readme = "../../README.md"

license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true


[dependencies]
oxidd-core.workspace = true

# allocation on huge pages
hugealloc = { workspace = true, optional = true }
allocator-api2 = { version = "0.2", default-features = false, features = [
  "alloc",
], optional = true }

# fast alternative Mutex & RwLock implementation
parking_lot = "0.12"

# hash table for the unique table
linear-hashtbl.workspace = true

# fast hash function
#
# Note that there is a performance regression with 2.0, see
# https://github.com/rust-lang/rustc-hash/issues/45
rustc-hash = "1.1"

# bit sets
fixedbitset = "0.5.7"

# thread pool
rayon = "1.10"

# `CachePadded`
crossbeam-utils = { version = "0.8", default-features = false }

# standard derive macros but with custom bounds on generics
derive-where = "1.5"

# run actions when unwinding
scopeguard = { version = "1.2", default-features = false }


[features]
default = ["hugealloc"]

## Report garbage collections to stderr
statistics = []

## Use the hugealloc crate to allocate memory
hugealloc = ["dep:hugealloc", "dep:allocator-api2", "linear-hashtbl/allocator-api2"]
